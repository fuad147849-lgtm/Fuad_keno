<!DOCTYPE html>
<html lang="am">
<head>
<meta name="google-site-verification" content="Va7YCaSlGDd0cj79G1CX86qCRXLUcL9OCNiBl14NB1o" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUADX KENO V2</title>
<style>
html{
  min-height:100%;
  background:#030809;
}

body{
  margin:0;
  padding:5px;
  min-height:100vh;
  background:#030809;
  color:white;
  font-family:Arial,sans-serif;
  position:relative;
  isolation:isolate;
}
  *{box-sizing:border-box}

body::before{
  content:"";
  position:fixed;
  inset:-20%;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(80,40,180,0.20), transparent 40%),
    radial-gradient(ellipse at 80% 70%, rgba(0,130,220,0.16), transparent 42%),
    radial-gradient(ellipse at 50% 50%, rgba(100,50,160,0.10), transparent 55%),
    radial-gradient(circle at 10% 20%, rgba(210,220,255,0.55) 1px, transparent 2px),
radial-gradient(circle at 25% 65%, rgba(180,210,255,0.45) 1px, transparent 2px),
radial-gradient(circle at 40% 35%, rgba(220,200,255,0.50) 1px, transparent 2px),
radial-gradient(circle at 55% 80%, rgba(180,220,255,0.45) 1px, transparent 2px),
radial-gradient(circle at 72% 25%, rgba(220,220,255,0.50) 1px, transparent 2px),
radial-gradient(circle at 90% 60%, rgba(180,210,255,0.45) 1px, transparent 2px),
  animation:cosmicMagic 18s ease-in-out infinite alternate;
}

@keyframes cosmicMagic{
  0%{
    transform:translate(-1%, -1%) scale(1);
    opacity:0.75;
  }
  50%{
    transform:translate(1%, 1%) scale(1.025);
    opacity:1;
  }
  100%{
    transform:translate(-1%, 1%) scale(1.01);
    opacity:0.8;
  }
}
  
h1{
  text-align:center;
  color:#f5c542;
  font-size:21px;
  margin:5px 0;
  text-shadow:0 0 8px #d99b20;
  letter-spacing:1px;
}
.card{
  background:transparent;
  padding:3px 10px;
  border-radius:10px;
  margin:2px 0;
}
.card{
  font-size:13px;
  line-height:1.35;
}
.card p{
  margin:5px 0;
}
.card h2{
  margin:5px 0;
  font-size:19px;
}  
.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:nowrap;
  min-height:0;
}
.topline input{
  width:48%;
  min-width:0;
  padding:6px;
}
.topline div{font-size:12px}
input{
  padding:6px;
  border:0;
  border-radius:7px;
  width:100%;
  background:#fff;
  color:#111;
}
button{border:0;border-radius:8px;padding:10px;background:#e7b936;color:#111;font-weight:bold;margin:4px}
button:disabled{opacity:.45}
.start{
  width:70%;
  font-size:13px;
  padding:5px;
  display:block;
  margin:0 auto;
}
.small{font-size:12px;color:#cbd1dc}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.num{
  background:#263b55;
  color:white;
  padding:10px 0;
  text-align:center;
  border-radius:6px;
  font-size:14px;
  border:0;
  margin:0;
}
.num.selected{
  background:#00e676;
  color:#003b20;
  box-shadow:0 0 8px #00e676;
}
.drawgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.draw{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#263b55;
  color:white;
  padding:0;
  text-align:center;
  border-radius:50%;
  font-weight:bold;
  font-size:12px;
  border:1px solid #3d5878;
}
.draw.hit,.num.hit,.ticketnum.hit{
  background:#16a36a;
  color:white;
  box-shadow:0 0 4px #16a36a;
}
.ticket{
  background:#1c3048;
  padding:6px;
  border:1px solid #34516f;
  border-radius:8px;
  margin:4px 0;
}
.ticketnums{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  margin-top:3px;
  min-height:0;
}
.ticketnum{
  background:#294563;
  color:white;
  padding:5px 7px;
  border:1px solid #3d5d7d;
  border-radius:5px;
  font-size:12px;
}
.result{color:#65e6a1;font-weight:bold}
#status{
  font-weight:bold;
  color:#f5c542;
  font-size:12px;
  margin:4px 0;
}
.details{font-size:11px;color:#d8deea;line-height:1.4}

.reward-panel{
 background:rgba(16,27,43,0.65);
  border:1px solid #294563;
  border-radius:8px;
  padding:5px;
  margin-bottom:5px;
  line-height:1.1;
}

.possible-win{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:bold;
  margin-bottom:4px;
}

#possibleWin{
  color:#65e6a1;
  font-size:16px;
}

.reward-row{
  display:flex;
  align-items:center;
  gap:5px;
  min-height:19px;
  font-size:11px;
}

.reward-row span{
  width:48px;
  flex-shrink:0;
  color:#cbd1dc;
}

#matchValues,
#paysValues{
  display:flex;
  flex:1;
  justify-content:space-around;
  gap:3px;
  text-align:center;
}

#paysValues{
  color:#65e6a1;
  font-weight:bold;
}

#selectedSlots{
  display:grid;
  grid-template-columns:repeat(10,minmax(0,1fr));
  gap:3px;
  margin-top:4px;
}

.selected-slot{
  height:20px;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border-radius:4px;
  font-size:11px;
  font-weight:bold;
  color:white;
}

.number-panel{
  background:transparent;
  border-radius:8px;
  padding:5px;
}
  
</style>
</head>
<body>

<h1>FUADX KENO V2</h1>

<!-- Player information -->
<div class="card">
  <div class="topline">
    <input id="player" placeholder="Player Name">
    <div>ብር: <b id="coins">0</b></div>
  </div>
  <div class="topline" style="margin-top:5px">
    <div>Ticket Price:
      <select id="ticketPrice">
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="10">10</option>
        <option value="20">20</option>
      </select> ብር
    </div>
    <div>Time Left: <b id="timer">--</b></div>
  </div>
  
</div>
<!-- ጨዋታ ማስጀመሪያ -->
<div class="card">
  <button class="start" id="startBtn" onclick="startGame()">ጨዋታ አስጀምር</button>
  <p id="status">ጨዋታውን ለመጀመር ይጫኑ።</p>
</div>
<div class="card">
  <div class="drawgrid" id="drawn"></div>
</div>
<!-- 80 ቁጥሮች -->

<div class="card" id="numberCard">

  <div class="reward-panel">
    <div class="possible-win">
      Possible Win
      <b id="possibleWin">0</b>
    </div>

    <div class="reward-row">
      <span>Match</span>
      <div id="matchValues"></div>
    </div>

    <div class="reward-row">
      <span>Pays</span>
      <div id="paysValues"></div>
    </div>

    <div id="selectedSlots"></div>
  </div>

  <div class="number-panel">
    <div class="grid" id="numbers"></div>
  </div>

  <p style="display:none"><b id="chosen">0</b></p>

  <button id="buyBtn" onclick="buyTicket()" disabled>
    Buy Ticket
  </button>

</div>
  
<!-- የተጫዋቾች ቲኬቶች -->
<div class="card">
  <b>የተጫዋች ቲኬቶች</b>
  <div id="tickets">
    <p class="small">ገና ቲኬት አልተገዛም።</p>
  </div>
</div>
<div class="card" id="roundReward">
  Round Rewards: <b id="myRoundReward">0</b> ብር
</div>
</div>
<script>
const API = "https://fuadx-keno-multiplayer.fuad147849.workers.dev";

let playerId = localStorage.getItem("fuadxPlayerId") || "";
let coins = 0;
let selected = [];
let tickets = [];
let drawn = [];
let players = {};
let phase = "waiting";
let seconds = 0;
let adminKey = "";
let lastCoinRequestCount = 0;

const $ = id => document.getElementById(id);

async function api(path, data, key) {
  const headers = {};

  if (data !== undefined) {
    headers["Content-Type"] = "text/plain;charset=UTF-8";
  }

  if (key) headers["X-Admin-Key"] = key;

  let response;

  try {
    response = await fetch(API + path, {
      method: data !== undefined ? "POST" : "GET",
      headers,
      body: data !== undefined ? JSON.stringify(data) : undefined
    });
  } catch (error) {
    throw new Error("NETWORK/CORS: " + error.message);
  }

  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error("Server returned invalid JSON. HTTP " + response.status);
  }

  if (!response.ok) {
    throw new Error(result.error || "HTTP " + response.status);
  }

  return result;
}
  
function showCoins() {
  $("coins").textContent = coins;
}

function makeGrid() {
  $("numbers").innerHTML = "";

  for (let n = 1; n <= 80; n++) {
    const b = document.createElement("button");
    b.className = "num";
    b.textContent = n;
    b.onclick = () => selectNumber(n);
    $("numbers").appendChild(b);
  }

  updateGrid();
}

function updateGrid() {
  document.querySelectorAll(".num").forEach(b => {
    const n = Number(b.textContent);
    b.classList.toggle("selected", selected.includes(n));
    b.disabled = phase !== "select";
  });

  $("chosen").textContent = selected.length;

  const price = Number($("ticketPrice").value);

  const REWARDS = {
    1: {1:3},
    2: {2:7},
    3: {2:2, 3:20},
    4: {2:1, 3:5, 4:30},
    5: {3:2, 4:10, 5:40},
    6: {3:1, 4:5, 5:15, 6:45},
    7: {4:1, 5:4, 6:15, 7:50},
    8: {4:2, 5:5, 6:20, 7:30, 8:55},
    9: {5:3, 6:10, 7:35, 8:45, 9:65},
    10: {5:2, 6:7, 7:40, 8:60, 9:80, 10:100}
  };

  const rewardMap = REWARDS[selected.length] || {};
  const entries = Object.entries(rewardMap);

  $("matchValues").innerHTML =
    entries.map(([match]) => `<span>${match}</span>`).join("");

  $("paysValues").innerHTML =
    entries.map(([, multiplier]) => `<span>×${multiplier}</span>`).join("");

  const maxMultiplier = Math.max(0, ...Object.values(rewardMap));

  $("possibleWin").textContent =
    (price * maxMultiplier).toFixed(2);

  $("selectedSlots").innerHTML =
    Array.from({length: 10}, (_, i) =>
      `<div class="selected-slot">${selected[i] || ""}</div>`
    ).join("");

  const myTickets = tickets.filter(t => t.playerId === playerId);

  console.log({
    phase,
    selected: selected.length,
    coins,
    price,
    myTickets: myTickets.length
  });

  $("buyBtn").disabled =
    phase !== "select" ||
    selected.length < 1 ||
    selected.length > 10 ||
    myTickets.length >= 10 ||
    coins < price;
}  

function selectNumber(n) {
  if (phase !== "select") return;

  if (selected.includes(n)) {
    selected = selected.filter(x => x !== n);
  } else if (selected.length < 10) {
    selected.push(n);
  }

  updateGrid();
}

function clearSelection() {
  selected = [];
  updateGrid();
}

async function joinGame() {
  const name = $("player").value.trim();

  if (!name) {
    alert("እባክህ ስምህን አስገባ።");
    return;
  }

  try {
    const result = await api("/join", {
      name,
      playerId
    });

    playerId = result.player.id;
    localStorage.setItem("fuadxPlayerId", playerId);
    coins = result.player.coins;

    showCoins();
    $("status").textContent = "ጨዋታውን ተቀላቅለሃል።";
    await refreshGame();
  } catch (error) {
    alert(error.message);
  }
}

async function startGame() {
  if (!playerId) {
    alert("መጀመሪያ ጨዋታውን ተቀላቀል።");
    return;
  }

  const key = adminKey || prompt("Admin Key አስገባ።");
  if (!key) return;

  try {
    const result = await api("/start", {}, key);
    adminKey = key;
    selected = [];
    await refreshGame();
    alert("ጨዋታው ተጀምሯል።");
  } catch (error) {
    adminKey = "";
    alert(error.message);
  }
}

async function buyTicket() {
  if (!playerId) {
    alert("መጀመሪያ ተቀላቀል።");
    return;
  }

  try {
    await api("/ticket", {
      playerId,
      numbers: selected,
      price: Number($("ticketPrice").value)
    });

    selected = [];
    await refreshGame();

  } catch (error) {
    alert(error.message);
  }
}
  
async function requestCoins() {
  if (!playerId) {
    alert("መጀመሪያ ጨዋታውን ተቀላቀል።");
    return;
  }

  try {
    const result = await api("/coin-request", { playerId });

    const coinButton = $("coinRequestBtn");

    if (coinButton) {
      coinButton.textContent = "✓ COIN ተጠይቋል";
      coinButton.style.background = "#d97706";
      coinButton.style.color = "#ffffff";
      coinButton.disabled = true;
    }

    alert(result.message || "የCOIN ጥያቄህ ተልኳል።");
  } catch (error) {
    alert(error.message);
  }
}
  
function showDrawn() {
  $("drawn").innerHTML = "";

  const myNumbers = new Set(
    tickets
      .filter(t => t.playerId === playerId)
      .flatMap(t => t.numbers.map(Number))
  );

  drawn.forEach(n => {
    const b = document.createElement("span");
    b.textContent = n;
    b.className = "draw";

    if (myNumbers.has(Number(n))) {
      b.classList.add("hit");
    }

    $("drawn").appendChild(b);
  });
}
  
function showTickets() {
  $("tickets").innerHTML = "";

  tickets.forEach(t => {
    const div = document.createElement("div");
    div.className = "ticket";

    const name = document.createElement("div");
    name.textContent = "Player: " + t.name;
    name.style.fontWeight = "bold";
    div.appendChild(name);

    const numbersBox = document.createElement("div");
    numbersBox.className = "ticketnums";

    const hitNumbers = t.numbers.filter(n => drawn.includes(n));

    t.numbers.forEach(n => {
      const number = document.createElement("span");
      number.className = "ticketnum";

      if (drawn.includes(n)) {
        number.classList.add("hit");
      }

      number.textContent = n;
      numbersBox.appendChild(number);
    });

    div.appendChild(numbersBox);

    const result = document.createElement("div");
    result.className = "small";
    result.style.marginTop = "6px";
    result.textContent =
      "የተመሳሰሉ: " + hitNumbers.length +
      " | ሽልማት: " + (t.reward || 0) + " COIN";

    div.appendChild(result);
    $("tickets").prepend(div);
  });
}
  
async function refreshGame() {
  try {
    const result = await api("/state");
    const game = result.game;
    if (adminKey) {
  try {
    const requests = await api("/admin/requests", undefined, adminKey);
    const pendingCount = (requests.requests || [])
      .filter(r => r.status === "pending").length;

    const adminButton = $("adminRequestsBtn");

    if (adminButton) {
      adminButton.textContent = pendingCount
   ? `🔔 New Requests (${pendingCount})`
       : "Admin: COIN Requests";

      adminButton.style.background = pendingCount
        ? "#d97706"
        : "";
    }
  } catch (error) {} 
}    
   
    tickets = Array.isArray(game.tickets) ? game.tickets : [];
  const myRoundReward = tickets
  .filter(t => t.playerId === playerId)
  .reduce((sum, t) => sum + Number(t.reward || 0), 0);

$("myRoundReward").textContent = myRoundReward;
    drawn = game.drawnNumbers || [];
    players = game.players || {};
   const notice = players[playerId]?.coinNotice;

if (notice) {
  const noticeKey = "fuadxSeenCoinNotice_" + playerId;
  if (localStorage.getItem(noticeKey) !== notice.id) {
    localStorage.setItem(noticeKey, notice.id);
    alert(notice.amount + " COIN ተጨምሮልሃል።");
  }
}
    phase = game.status;

   $("numberCard").style.display =
  phase === "draw" ? "none" : "";
    if (playerId && players[playerId]) {
      coins = players[playerId].coins;
      showCoins();
    }

    if (phase === "waiting") {
      $("status").textContent = "አዲስ ጨዋታ እየተጠበቀ ነው።";
    } else if (phase === "select") {
      $("status").textContent = "";
    } else if (phase === "draw") {
      $("status").textContent = "";
    } else if (phase === "finished") {
      $("status").textContent = "ጨዋታው ተጠናቋል።";
    }
 
   if (phase === "select" && game.selectionEndsAt) {
  seconds = Math.max(
    0,
    Math.ceil((game.selectionEndsAt - Date.now()) / 1000)
  );
} else if (phase === "draw" && game.drawStartedAt) {
  seconds = Math.max(
    0,
    Math.ceil((game.drawStartedAt + 20000 - Date.now()) / 1000)
  );
} else {
  seconds = 0;
}

$("timer").textContent = seconds; 

    showDrawn();
    showTickets();
    updateGrid();
  } catch (error) {
    $("status").textContent = "ከአገልጋዩ ጋር ግንኙነት አልተሳካም።";
  }
}

async function adminRequests() {
  const key = adminKey || prompt("Admin Key አስገባ።");
  if (!key) return;

  try {
    const result = await api("/admin/requests", undefined, key);
    adminKey = key;

    let panel = $("adminRequestsPanel");

    if (!panel) {
      panel = document.createElement("div");
      panel.id = "adminRequestsPanel";
      panel.className = "card";
      $("tickets").parentElement.appendChild(panel);
    }

    panel.innerHTML = "<h3>የCOIN ጥያቄዎች</h3>";

    const pending = result.requests.filter(r => r.status === "pending");

    if (!pending.length) {
      panel.append("ምንም የተጠባባቂ ጥያቄ የለም።");
      return;
    }

    pending.forEach(r => {
      const item = document.createElement("div");
      item.style.padding = "8px";

      const name = document.createElement("span");
      name.textContent = r.name + " — ";

      const amount = document.createElement("input");
      amount.type = "number";
      amount.min = "1";
      amount.max = "10000";
      amount.value = "100";
      amount.style.width = "80px";

      const approve = document.createElement("button");
      approve.textContent = "COIN ስጥ";

      approve.onclick = async () => {
        try {
          await api("/admin/give-coins", {
            requestId: r.id,
            amount: Number(amount.value)
          }, adminKey);

          alert("COIN ተጨምሯል።");
          await adminRequests();
          await refreshGame();
        } catch (error) {
          alert(error.message);
        }
      };

      item.append(name, amount, approve);
      panel.appendChild(item);
    });
  } catch (error) {
    adminKey = "";
    alert(error.message);
  }
}

function addExtraButtons() {
  const player = $("player");

  const join = document.createElement("button");
  join.textContent = "Join Game";
join.style.margin = "3px";
join.style.padding = "6px 9px";
join.style.fontSize = "12px";
  join.onclick = joinGame;
  player.insertAdjacentElement("afterend", join);

  const coin = document.createElement("button");
coin.id = "coinRequestBtn";
coin.textContent = "ብር Request";
coin.style.margin = "3px";
coin.style.padding = "6px 9px";
coin.style.fontSize = "12px";
join.insertAdjacentElement("afterend", coin);
coin.onclick = requestCoins;

 const admin = document.createElement("button");
admin.textContent = "Admin: ብር Requests";
admin.id = "adminRequestsBtn";

const startBtn = $("startBtn");
const reward = $("roundReward");
const playerCard = $("player").closest(".card");

const adminRow = document.createElement("div");
adminRow.style.display = "flex";
adminRow.style.alignItems = "center";
adminRow.style.gap = "5px";
adminRow.style.flexWrap = "nowrap";
adminRow.style.width = "100%";
adminRow.style.marginTop = "6px";

[startBtn, admin].forEach(btn => {
  btn.style.flex = "1";
  btn.style.width = "50%";
  btn.style.minWidth = "0";
  btn.style.height = "34px";
  btn.style.margin = "0";
  btn.style.padding = "5px 2px";
  btn.style.fontSize = "12px";
  btn.style.boxSizing = "border-box";
});

adminRow.appendChild(startBtn);
adminRow.appendChild(admin);
playerCard.appendChild(adminRow);

playerCard.insertAdjacentElement("afterend", reward);

admin.onclick = adminRequests; 
}

$("ticketPrice").addEventListener("change", updateGrid);

makeGrid();
showCoins();
addExtraButtons();

if (playerId) {
  api("/state").then(result => {
    const player = result.game.players[playerId];
    if (player) {
      $("player").value = player.name;
      coins = player.coins;
      showCoins();
    }
    refreshGame();
  }).catch(() => {});
}

setInterval(refreshGame, 1500);
</script>
